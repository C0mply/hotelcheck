<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HotelCheck - Reservation Validation</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Reservation Validation Demo</h1>
      <p>
        Validate reservation input using the Strategy-based backend logic model
        adapted for the web demo.
      </p>
    </header>

    <main class="card">
      <div class="form-grid">
        <div class="form-group">
          <label for="guestId">Guest ID</label>
          <input id="guestId" type="number" value="1" />
        </div>

        <div class="form-group">
          <label for="roomId">Room ID</label>
          <input id="roomId" type="number" value="101" />
        </div>

        <div class="form-group">
          <label for="checkIn">Check-in Date</label>
          <input id="checkIn" type="date" />
        </div>

        <div class="form-group">
          <label for="checkOut">Check-out Date</label>
          <input id="checkOut" type="date" />
        </div>
      </div>

      <div class="options">
        <label class="checkbox-row">
          <input id="roomExists" type="checkbox" checked />
          <span>Room exists</span>
        </label>

        <label class="checkbox-row">
          <input id="simulateOverlap" type="checkbox" />
          <span>Simulate overlapping reservation</span>
        </label>
      </div>

      <div class="actions">
        <button id="validateButton" class="primary-button">
          Validate Reservation
        </button>
      </div>

      <section id="resultPanel" class="result-panel neutral">
        <h2>Validation Result</h2>
        <p id="resultText">Press the button to validate a reservation.</p>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
